/* Compact monochrome game layout */
:root{--bg:#111;--panel:#1b1b1b;--panel2:#242424;--line:#3b3b3b;--muted:#a3a3a3;--text:#f0f0f0;--lime:#91ba64}
body{background:#111;font-family:Arial,system-ui,sans-serif}
.shell{height:100dvh;max-width:1500px;padding:12px 22px;display:flex;flex-direction:column;gap:10px;overflow:hidden}

.cell{border-radius:3px;border-color:#444;background:#202020;padding:0;transition:none}.cell.blockedge{margin-right:5px}.cell.rowedge{margin-bottom:5px}.cell.related,.cell.given{background:#2b2b2b}.cell.selected{background:#33402d;border-color:var(--lime);box-shadow:none;outline:1px solid var(--lime);z-index:1}.cell.error{background:#4a2929}.value{color:var(--lime);font-size:clamp(12px,2.2vh,24px)}.given .value{color:#e0e0e0}.pencil{inset:3px;color:#aaa;font-size:clamp(6px,.9vh,9px)}
.cell.related{background:#303b2c}
